name: Build and Release ThonCode (Pre-release)

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (patch/minor/major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Custom version number (optional, e.g., 1.2.3)'
        required: false
        type: string

env:
  PROJECT_NAME: ThonCode
  BUILD_BRANCH: build-artifacts
  VERSION_FILE: .version
  KEEP_RECENT_BUILDS: 10

jobs:
  prepare-build:
    name: Prepare Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.build-number.outputs.number }}
      is_prerelease: true
      version_tag: v${{ steps.version.outputs.version }}-prerelease.${{ steps.build-number.outputs.number }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Get or create version file
      id: version
      run: |
        if [ -f "${{ env.VERSION_FILE }}" ]; then
          CURRENT_VERSION=$(cat ${{ env.VERSION_FILE }})
          echo "Current version: $CURRENT_VERSION"
        else
          CURRENT_VERSION="0.1.0"
          echo "$CURRENT_VERSION" > ${{ env.VERSION_FILE }}
          echo "Created version file with: $CURRENT_VERSION"
        fi
        
        MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
        MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
        PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
        
        if [ "${{ github.event.inputs.custom_version }}" != "" ]; then
          NEW_VERSION="${{ github.event.inputs.custom_version }}"
        elif [ "${{ github.event.inputs.version_bump }}" == "major" ]; then
          NEW_VERSION="$((MAJOR+1)).0.0"
        elif [ "${{ github.event.inputs.version_bump }}" == "minor" ]; then
          NEW_VERSION="$MAJOR.$((MINOR+1)).0"
        else
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH+1))"
        fi
        
        echo "New version: $NEW_VERSION"
        echo "$NEW_VERSION" > ${{ env.VERSION_FILE }}
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add ${{ env.VERSION_FILE }}
        git commit -m "Bump version to $NEW_VERSION [skip ci]" || echo "No changes to commit"
        git push origin ${{ github.ref_name }} || echo "Push failed, continuing..."
    
    - name: Generate build number
      id: build-number
      run: |
        BUILD_NUM=$(date +'%Y%m%d%H%M%S')
        echo "number=$BUILD_NUM" >> $GITHUB_OUTPUT
        echo "Build number: $BUILD_NUM"
    
    - name: Create/Update build branch
      run: |
        if git ls-remote --heads origin ${{ env.BUILD_BRANCH }} | grep -q ${{ env.BUILD_BRANCH }}; then
          echo "Build branch ${{ env.BUILD_BRANCH }} exists"
          git checkout ${{ env.BUILD_BRANCH }}
          git pull origin ${{ env.BUILD_BRANCH }}
        else
          echo "Creating new build branch: ${{ env.BUILD_BRANCH }}"
          git checkout --orphan ${{ env.BUILD_BRANCH }}
          git rm -rf .
          
          mkdir -p windows windows-nuitka linux linux-pyinstaller latest
          
          echo "# ThonCode Build Artifacts" > README.md
          echo "" >> README.md
          echo "This branch stores automatically built ThonCode artifacts." >> README.md
          echo "" >> README.md
          echo "## Directory Structure" >> README.md
          echo "" >> README.md
          echo "- windows/ - Windows builds (PyInstaller)" >> README.md
          echo "- windows-nuitka/ - Windows builds (Nuitka)" >> README.md
          echo "- linux/ - Linux builds (Nuitka)" >> README.md
          echo "- linux-pyinstaller/ - Linux builds (PyInstaller)" >> README.md
          echo "- latest/ - Latest builds" >> README.md
          echo "" >> README.md
          echo "## Build Information" >> README.md
          echo "" >> README.md
          echo "These are automatically built pre-release versions for testing purposes." >> README.md
          
          git add README.md
          git commit -m "Initialize build artifacts branch"
          git push origin ${{ env.BUILD_BRANCH }}
        fi
        
        BUILD_DIR="build_${{ steps.build-number.outputs.number }}"
        mkdir -p $BUILD_DIR
        
        echo "build_dir=$BUILD_DIR" >> $GITHUB_ENV
    
    - name: Save version info
      run: |
        echo "ThonCode ${{ steps.version.outputs.version }}" > version_info.txt
        echo "Build: ${{ steps.build-number.outputs.number }}" >> version_info.txt
        echo "Date: $(date '+%Y-%m-%d %H:%M:%S')" >> version_info.txt
        echo "Commit: ${{ github.sha }}" >> version_info.txt
        echo "Branch: ${{ github.ref_name }}" >> version_info.txt

  # ============================================================
  # Windows PyInstaller Build
  # ============================================================
  build-windows-pyinstaller:
    name: Windows (PyInstaller)
    needs: prepare-build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter pillow send2trash
        if (Test-Path requirements.txt) {
          pip install -r requirements.txt
        }
        if (Test-Path pyproject.toml) {
          pip install .
        }
    
    - name: Build with PyInstaller
      working-directory: src/thoncode
      run: |
        pyinstaller --name ThonCode `
          --onedir `
          --windowed `
          --icon "assets/icon.ico" `
          --add-data "assets;assets" `
          --add-data "libs;libs" `
          --hidden-import customtkinter `
          --hidden-import PIL `
          --hidden-import PIL.Image `
          --hidden-import PIL.ImageTk `
          --hidden-import send2trash `
          --hidden-import libs `
          --hidden-import libs.gui `
          --hidden-import libs.gui.code_editor `
          --hidden-import libs.gui.configure_runtime `
          --hidden-import libs.gui.editor_completion `
          --hidden-import libs.gui.editor_folding `
          --hidden-import libs.gui.editor_highlight `
          --hidden-import libs.gui.editor_manager `
          --hidden-import libs.gui.editor_shortcuts `
          --hidden-import libs.gui.editor_ui `
          --hidden-import libs.gui.project_cfg `
          --hidden-import libs.gui.run_file `
          --hidden-import libs.gui.settings_win `
          --hidden-import libs.gui.tree_manager `
          --hidden-import libs.cfg_handle `
          --hidden-import libs.struct_handle `
          --hidden-import libs.font_loader `
          --hidden-import libs.json_handle `
          --hidden-import libs.langs_handle `
          --collect-all libs `
          main.py
    
    - name: Prepare artifacts
      run: |
        $VERSION = "${{ needs.prepare-build.outputs.version }}"
        $BUILD_NUM = "${{ needs.prepare-build.outputs.build_number }}"
        $ARCH = "x86_64"
        
        New-Item -ItemType Directory -Force -Path "dist_staging"
        Copy-Item -Recurse -Force src/thoncode/dist/* dist_staging/
        
        @"
        ThonCode $VERSION
        Build: $BUILD_NUM
        Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
        Platform: Windows
        Arch: $ARCH
        Builder: PyInstaller
        Commit: ${{ github.sha }}
        "@ | Out-File -FilePath dist_staging/version.txt -Encoding UTF8
        
        $ZIP_NAME = "ThonCode-Windows-$ARCH-$VERSION-b$BUILD_NUM.zip"
        Compress-Archive -Path dist_staging/* -DestinationPath $ZIP_NAME -Force
        echo "ZIP_NAME=$ZIP_NAME" >> $env:GITHUB_ENV
    
    - name: Upload to build branch
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        git fetch origin ${{ env.BUILD_BRANCH }}
        git checkout ${{ env.BUILD_BRANCH }} || git checkout -b ${{ env.BUILD_BRANCH }}
        
        $BUILD_DIR = "build_${{ needs.prepare-build.outputs.build_number }}"
        $VERSION = "${{ needs.prepare-build.outputs.version }}"
        $ZIP_NAME = "${{ env.ZIP_NAME }}"
        
        New-Item -ItemType Directory -Force -Path "windows/$BUILD_DIR"
        New-Item -ItemType Directory -Force -Path "windows/latest"
        
        Copy-Item $ZIP_NAME "windows/$BUILD_DIR/"
        Copy-Item $ZIP_NAME "windows/latest/ThonCode-Windows-latest.zip"
        
        Copy-Item dist_staging/version.txt "windows/$BUILD_DIR/"
        Copy-Item dist_staging/version.txt "windows/latest/"
        
        git add windows/
        git commit -m "Add Windows-PyInstaller build $VERSION-b${{ needs.prepare-build.outputs.build_number }} [skip ci]" || echo "No changes"
        git push origin ${{ env.BUILD_BRANCH }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThonCode-Windows-PyInstaller-${{ needs.prepare-build.outputs.version }}
        path: ${{ env.ZIP_NAME }}
        retention-days: 30

  # ============================================================
  # Windows Nuitka Build
  # ============================================================
  build-windows-nuitka:
    name: Windows (Nuitka)
    needs: prepare-build
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka zstandard ordered-set
        pip install customtkinter pillow send2trash
        if (Test-Path requirements.txt) {
          pip install -r requirements.txt
        }
        if (Test-Path pyproject.toml) {
          pip install .
        }
    
    - name: Build with Nuitka
      working-directory: src/thoncode
      run: |
        nuitka --standalone `
          --onefile `
          --windows-icon-from-ico=assets/icon.ico `
          --include-data-dir=assets=assets `
          --include-module=libs `
          --include-module=libs.gui `
          --include-module=libs.gui.code_editor `
          --include-module=libs.gui.configure_runtime `
          --include-module=libs.gui.editor_completion `
          --include-module=libs.gui.editor_folding `
          --include-module=libs.gui.editor_highlight `
          --include-module=libs.gui.editor_manager `
          --include-module=libs.gui.editor_shortcuts `
          --include-module=libs.gui.editor_ui `
          --include-module=libs.gui.project_cfg `
          --include-module=libs.gui.run_file `
          --include-module=libs.gui.settings_win `
          --include-module=libs.gui.tree_manager `
          --include-module=libs.cfg_handle `
          --include-module=libs.struct_handle `
          --include-module=libs.font_loader `
          --include-module=libs.json_handle `
          --include-module=libs.langs_handle `
          --include-module=customtkinter `
          --include-module=PIL `
          --include-module=PIL.Image `
          --include-module=PIL.ImageTk `
          --enable-plugin=tk-inter `
          --output-dir=dist `
          --remove-output `
          main.exe
    
    - name: Prepare artifacts
      run: |
        $VERSION = "${{ needs.prepare-build.outputs.version }}"
        $BUILD_NUM = "${{ needs.prepare-build.outputs.build_number }}"
        $ARCH = "x86_64"
        
        New-Item -ItemType Directory -Force -Path "dist_staging"
        
        $EXE = Get-ChildItem -Path src/thoncode/dist -Filter "*.exe" -Recurse | Select-Object -First 1
        if ($EXE) {
          Copy-Item $EXE.FullName dist_staging/ThonCode.exe
        } else {
          Write-Error "No executable found!"
          exit 1
        }
        
        @"
        ThonCode $VERSION
        Build: $BUILD_NUM
        Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
        Platform: Windows
        Arch: $ARCH
        Builder: Nuitka
        Commit: ${{ github.sha }}
        "@ | Out-File -FilePath dist_staging/version.txt -Encoding UTF8
        
        $ZIP_NAME = "ThonCode-Windows-$ARCH-$VERSION-b$BUILD_NUM-nuitka.zip"
        Compress-Archive -Path dist_staging/* -DestinationPath $ZIP_NAME -Force
        echo "ZIP_NAME=$ZIP_NAME" >> $env:GITHUB_ENV
    
    - name: Upload to build branch
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        git fetch origin ${{ env.BUILD_BRANCH }}
        git checkout ${{ env.BUILD_BRANCH }} || git checkout -b ${{ env.BUILD_BRANCH }}
        
        $BUILD_DIR = "build_${{ needs.prepare-build.outputs.build_number }}"
        $ZIP_NAME = "${{ env.ZIP_NAME }}"
        
        New-Item -ItemType Directory -Force -Path "windows-nuitka/$BUILD_DIR"
        New-Item -ItemType Directory -Force -Path "windows-nuitka/latest"
        
        Copy-Item $ZIP_NAME "windows-nuitka/$BUILD_DIR/"
        Copy-Item $ZIP_NAME "windows-nuitka/latest/ThonCode-Windows-Nuitka-latest.zip"
        
        Copy-Item dist_staging/version.txt "windows-nuitka/$BUILD_DIR/"
        Copy-Item dist_staging/version.txt "windows-nuitka/latest/"
        
        git add windows-nuitka/
        git commit -m "Add Windows-Nuitka build $VERSION-b${{ needs.prepare-build.outputs.build_number }} [skip ci]" || echo "No changes"
        git push origin ${{ env.BUILD_BRANCH }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThonCode-Windows-Nuitka-${{ needs.prepare-build.outputs.version }}
        path: ${{ env.ZIP_NAME }}
        retention-days: 30

  # ============================================================
  # Linux Nuitka Build
  # ============================================================
  build-linux-nuitka:
    name: Linux (Nuitka)
    needs: prepare-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          python3-tk \
          patchelf \
          ccache \
          gcc \
          g++ \
          make \
          libx11-dev \
          libxext-dev \
          libxrender-dev \
          libxft-dev \
          libxcb-xfixes0-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka zstandard ordered-set
        pip install customtkinter pillow send2trash
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        if [ -f pyproject.toml ]; then
          pip install -e .
        fi
    
    - name: Build with Nuitka
      working-directory: src/thoncode
      run: |
        export CCACHE_DIR=$HOME/.ccache
        export CCACHE_MAXSIZE=2G
        
        nuitka --standalone \
          --onefile \
          --linux-onefile-icon=assets/icon.png \
          --include-data-dir=assets=assets \
          --include-module=libs \
          --include-module=libs.gui \
          --include-module=libs.gui.code_editor \
          --include-module=libs.gui.configure_runtime \
          --include-module=libs.gui.editor_completion \
          --include-module=libs.gui.editor_folding \
          --include-module=libs.gui.editor_highlight \
          --include-module=libs.gui.editor_manager \
          --include-module=libs.gui.editor_shortcuts \
          --include-module=libs.gui.editor_ui \
          --include-module=libs.gui.project_cfg \
          --include-module=libs.gui.run_file \
          --include-module=libs.gui.settings_win \
          --include-module=libs.gui.tree_manager \
          --include-module=libs.cfg_handle \
          --include-module=libs.struct_handle \
          --include-module=libs.font_loader \
          --include-module=libs.json_handle \
          --include-module=libs.langs_handle \
          --include-module=customtkinter \
          --include-module=PIL \
          --include-module=PIL.Image \
          --include-module=PIL.ImageTk \
          --enable-plugin=tk-inter \
          --output-dir=dist \
          --remove-output \
          main.py || true
        
        if [ ! -f dist/main.exe ] && [ ! -f dist/main.bin ]; then
          echo "Onefile build failed, trying standalone..."
          nuitka --standalone \
            --include-data-dir=assets=assets \
            --include-module=libs \
            --include-module=libs.gui \
            --include-module=libs.gui.code_editor \
            --include-module=libs.gui.configure_runtime \
            --include-module=libs.gui.editor_completion \
            --include-module=libs.gui.editor_folding \
            --include-module=libs.gui.editor_highlight \
            --include-module=libs.gui.editor_manager \
            --include-module=libs.gui.editor_shortcuts \
            --include-module=libs.gui.editor_ui \
            --include-module=libs.gui.project_cfg \
            --include-module=libs.gui.run_file \
            --include-module=libs.gui.settings_win \
            --include-module=libs.gui.tree_manager \
            --include-module=libs.cfg_handle \
            --include-module=libs.struct_handle \
            --include-module=libs.font_loader \
            --include-module=libs.json_handle \
            --include-module=libs.langs_handle \
            --include-module=customtkinter \
            --include-module=PIL \
            --include-module=PIL.Image \
            --include-module=PIL.ImageTk \
            --enable-plugin=tk-inter \
            --output-dir=dist-standalone \
            --remove-output \
            main.py
        fi
    
    - name: Prepare artifacts
      run: |
        mkdir -p dist_staging
        VERSION="${{ needs.prepare-build.outputs.version }}"
        BUILD_NUM="${{ needs.prepare-build.outputs.build_number }}"
        ARCH="x86_64"
        
        if [ -f src/thoncode/dist/main.exe ]; then
          cp src/thoncode/dist/main.exe dist_staging/thoncode
        elif [ -f src/thoncode/dist/main.bin ]; then
          cp src/thoncode/dist/main.bin dist_staging/thoncode
        elif [ -f src/thoncode/dist-standalone/main.dist/main.exe ]; then
          cp -r src/thoncode/dist-standalone/main.dist/* dist_staging/
          mv dist_staging/main.exe dist_staging/thoncode
        else
          echo "No executable found!"
          find src/thoncode -name "main*" -type f
          exit 1
        fi
        
        chmod +x dist_staging/thoncode
        
        cat > dist_staging/version.txt << 'EOF'
        ThonCode $VERSION
        Build: $BUILD_NUM
        Date: $(date '+%Y-%m-%d %H:%M:%S')
        Platform: Linux
        Arch: $ARCH
        Builder: Nuitka
        Commit: ${{ github.sha }}
        EOF
        
        sed -i "s/\$VERSION/$VERSION/g" dist_staging/version.txt
        sed -i "s/\$BUILD_NUM/$BUILD_NUM/g" dist_staging/version.txt
        sed -i "s/\$ARCH/$ARCH/g" dist_staging/version.txt
        
        cd dist_staging
        TAR_NAME="ThonCode-Linux-$ARCH-$VERSION-b$BUILD_NUM-nuitka.tar.gz"
        tar -czf ../$TAR_NAME *
        cd ..
        echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV
    
    - name: Upload to build branch
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        git fetch origin ${{ env.BUILD_BRANCH }}
        git checkout ${{ env.BUILD_BRANCH }} || git checkout -b ${{ env.BUILD_BRANCH }}
        
        BUILD_DIR="build_${{ needs.prepare-build.outputs.build_number }}"
        TAR_NAME="${{ env.TAR_NAME }}"
        VERSION="${{ needs.prepare-build.outputs.version }}"
        
        mkdir -p linux/$BUILD_DIR
        mkdir -p linux/latest
        
        cp $TAR_NAME linux/$BUILD_DIR/
        cp $TAR_NAME linux/latest/ThonCode-Linux-Nuitka-latest.tar.gz
        
        cp dist_staging/version.txt linux/$BUILD_DIR/
        cp dist_staging/version.txt linux/latest/
        
        git add linux/
        git commit -m "Add Linux-Nuitka build $VERSION-b${{ needs.prepare-build.outputs.build_number }} [skip ci]" || echo "No changes"
        git push origin ${{ env.BUILD_BRANCH }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThonCode-Linux-Nuitka-${{ needs.prepare-build.outputs.version }}
        path: ${{ env.TAR_NAME }}
        retention-days: 30

  # ============================================================
  # Linux PyInstaller Build
  # ============================================================
  build-linux-pyinstaller:
    name: Linux (PyInstaller)
    needs: prepare-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          python3-tk \
          libx11-dev \
          libxext-dev \
          libxrender-dev \
          libxft-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter pillow send2trash
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        if [ -f pyproject.toml ]; then
          pip install -e .
        fi
    
    - name: Build with PyInstaller
      working-directory: src/thoncode
      run: |
        pyinstaller --name ThonCode \
          --onedir \
          --windowed \
          --icon "assets/icon.png" \
          --add-data "assets:assets" \
          --add-data "libs:libs" \
          --hidden-import customtkinter \
          --hidden-import PIL \
          --hidden-import PIL.Image \
          --hidden-import PIL.ImageTk \
          --hidden-import send2trash \
          --hidden-import libs \
          --hidden-import libs.gui \
          --hidden-import libs.gui.code_editor \
          --hidden-import libs.gui.configure_runtime \
          --hidden-import libs.gui.editor_completion \
          --hidden-import libs.gui.editor_folding \
          --hidden-import libs.gui.editor_highlight \
          --hidden-import libs.gui.editor_manager \
          --hidden-import libs.gui.editor_shortcuts \
          --hidden-import libs.gui.editor_ui \
          --hidden-import libs.gui.project_cfg \
          --hidden-import libs.gui.run_file \
          --hidden-import libs.gui.settings_win \
          --hidden-import libs.gui.tree_manager \
          --hidden-import libs.cfg_handle \
          --hidden-import libs.struct_handle \
          --hidden-import libs.font_loader \
          --hidden-import libs.json_handle \
          --hidden-import libs.langs_handle \
          --collect-all libs \
          main.py
    
    - name: Prepare artifacts
      run: |
        mkdir -p dist_staging
        VERSION="${{ needs.prepare-build.outputs.version }}"
        BUILD_NUM="${{ needs.prepare-build.outputs.build_number }}"
        ARCH="x86_64"
        
        cp -r src/thoncode/dist/* dist_staging/
        
        if [ -f dist_staging/ThonCode ]; then
          mv dist_staging/ThonCode dist_staging/thoncode
        elif [ -f dist_staging/main ]; then
          mv dist_staging/main dist_staging/thoncode
        fi
        chmod +x dist_staging/thoncode
        
        cat > dist_staging/version.txt << 'EOF'
        ThonCode $VERSION
        Build: $BUILD_NUM
        Date: $(date '+%Y-%m-%d %H:%M:%S')
        Platform: Linux
        Arch: $ARCH
        Builder: PyInstaller
        Commit: ${{ github.sha }}
        EOF
        
        sed -i "s/\$VERSION/$VERSION/g" dist_staging/version.txt
        sed -i "s/\$BUILD_NUM/$BUILD_NUM/g" dist_staging/version.txt
        sed -i "s/\$ARCH/$ARCH/g" dist_staging/version.txt
        
        cd dist_staging
        TAR_NAME="ThonCode-Linux-$ARCH-$VERSION-b$BUILD_NUM-pyinstaller.tar.gz"
        tar -czf ../$TAR_NAME *
        cd ..
        echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV
    
    - name: Upload to build branch
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        git fetch origin ${{ env.BUILD_BRANCH }}
        git checkout ${{ env.BUILD_BRANCH }} || git checkout -b ${{ env.BUILD_BRANCH }}
        
        BUILD_DIR="build_${{ needs.prepare-build.outputs.build_number }}"
        TAR_NAME="${{ env.TAR_NAME }}"
        VERSION="${{ needs.prepare-build.outputs.version }}"
        
        mkdir -p linux-pyinstaller/$BUILD_DIR
        mkdir -p linux-pyinstaller/latest
        
        cp $TAR_NAME linux-pyinstaller/$BUILD_DIR/
        cp $TAR_NAME linux-pyinstaller/latest/ThonCode-Linux-PyInstaller-latest.tar.gz
        
        cp dist_staging/version.txt linux-pyinstaller/$BUILD_DIR/
        cp dist_staging/version.txt linux-pyinstaller/latest/
        
        git add linux-pyinstaller/
        git commit -m "Add Linux-PyInstaller build $VERSION-b${{ needs.prepare-build.outputs.build_number }} [skip ci]" || echo "No changes"
        git push origin ${{ env.BUILD_BRANCH }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ThonCode-Linux-PyInstaller-${{ needs.prepare-build.outputs.version }}
        path: ${{ env.TAR_NAME }}
        retention-days: 30

  # ============================================================
  # Cleanup old builds
  # ============================================================
  cleanup:
    name: Cleanup Old Builds
    needs: [prepare-build, build-windows-pyinstaller, build-windows-nuitka, build-linux-nuitka, build-linux-pyinstaller]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
    
    steps:
    - name: Checkout build branch
      uses: actions/checkout@v4
      with:
        ref: ${{ env.BUILD_BRANCH }}
        fetch-depth: 0
    
    - name: Cleanup old builds
      run: |
        KEEP=${{ env.KEEP_RECENT_BUILDS }}
        echo "Keeping $KEEP recent builds..."
        
        cd windows || exit 0
        ls -1d build_* 2>/dev/null | sort | head -n -$KEEP | xargs -r rm -rf
        cd ..
        
        cd windows-nuitka || exit 0
        ls -1d build_* 2>/dev/null | sort | head -n -$KEEP | xargs -r rm -rf
        cd ..
        
        cd linux || exit 0
        ls -1d build_* 2>/dev/null | sort | head -n -$KEEP | xargs -r rm -rf
        cd ..
        
        cd linux-pyinstaller || exit 0
        ls -1d build_* 2>/dev/null | sort | head -n -$KEEP | xargs -r rm -rf
        cd ..
        
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "Cleanup old builds (kept $KEEP recent) [skip ci]" || echo "No changes to commit"
        git push origin ${{ env.BUILD_BRANCH }}

  # ============================================================
  # Create pre-release
  # ============================================================
  create-prerelease:
    name: Create Pre-release
    needs: [prepare-build, build-windows-pyinstaller, build-windows-nuitka, build-linux-nuitka, build-linux-pyinstaller]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout build branch
      uses: actions/checkout@v4
      with:
        ref: ${{ env.BUILD_BRANCH }}
        fetch-depth: 0
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
    
    - name: List artifacts
      run: |
        echo "Downloaded artifacts:"
        find artifacts/ -type f \( -name "*.zip" -o -name "*.tar.gz" \) | sort
    
    - name: Create pre-release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ needs.prepare-build.outputs.version }}-prerelease.${{ needs.prepare-build.outputs.build_number }}
        name: Pre-release v${{ needs.prepare-build.outputs.version }} (Build ${{ needs.prepare-build.outputs.build_number }})
        body: |
          ## Pre-release Version
          
          This is an automatically built pre-release version for testing purposes only.
          
          ### Version Information
          - Version: v${{ needs.prepare-build.outputs.version }}
          - Build Number: ${{ needs.prepare-build.outputs.build_number }}
          - Build Time: $(date '+%Y-%m-%d %H:%M:%S')
          - Commit: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          
          ### Downloads
          
          #### Windows (PyInstaller)
          - ThonCode-Windows-x86_64-${{ needs.prepare-build.outputs.version }}-b${{ needs.prepare-build.outputs.build_number }}.zip
          
          #### Windows (Nuitka)
          - ThonCode-Windows-x86_64-${{ needs.prepare-build.outputs.version }}-b${{ needs.prepare-build.outputs.build_number }}-nuitka.zip
          
          #### Linux (Nuitka)
          - ThonCode-Linux-x86_64-${{ needs.prepare-build.outputs.version }}-b${{ needs.prepare-build.outputs.build_number }}-nuitka.tar.gz
          
          #### Linux (PyInstaller)
          - ThonCode-Linux-x86_64-${{ needs.prepare-build.outputs.version }}-b${{ needs.prepare-build.outputs.build_number }}-pyinstaller.tar.gz
          
          ### Build Artifacts Branch
          All build artifacts are also stored in the build-artifacts branch.
          
          ### Quick Installation
          
          Windows (PyInstaller):
          Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/v${{ needs.prepare-build.outputs.version }}-prerelease.${{ needs.prepare-build.outputs.build_number }}/ThonCode-Windows-x86_64-${{ needs.prepare-build.outputs.version }}-b${{ needs.prepare-build.outputs.build_number }}.zip" -OutFile "ThonCode.zip"
          Expand-Archive ThonCode.zip -DestinationPath "ThonCode"
          
          Linux (Nuitka):
          wget https://github.com/${{ github.repository }}/releases/download/v${{ needs.prepare-build.outputs.version }}-prerelease.${{ needs.prepare-build.outputs.build_number }}/ThonCode-Linux-x86_64-${{ needs.prepare-build.outputs.version }}-b${{ needs.prepare-build.outputs.build_number }}-nuitka.tar.gz
          tar -xzf ThonCode-Linux-x86_64-${{ needs.prepare-build.outputs.version }}-b${{ needs.prepare-build.outputs.build_number }}-nuitka.tar.gz
          chmod +x thoncode
          ./thoncode
          
          ### Notes
          - This is a pre-release version that may contain incomplete features or bugs
          - Please backup your important data before using
          - Please submit an Issue if you encounter any problems
        draft: false
        prerelease: true
        files: |
          artifacts/**/*.zip
          artifacts/**/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}